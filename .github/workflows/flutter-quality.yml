name: Flutter CI

on:
  pull_request:
    paths:
      - ".github/workflows/flutter-quality.yml"
      - "app/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/flutter-quality.yml"
      - "app/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLUTTER_VERSION: 3.44.8

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Flutter quality
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Freezed, JSON, Riverpod, and Drift sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze with fatal diagnostics
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run architecture, unit, widget, and golden tests
        run: flutter test --coverage

      - name: Build Android debug artifact
        run: flutter build apk --debug --flavor sideload

      - name: Upload Android debug APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: xiguang-android-debug-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-sideload-debug.apk
          if-no-files-found: error
          retention-days: 14
