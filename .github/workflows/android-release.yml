name: Android Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  FLUTTER_VERSION: 3.44.8
  API_BASE_URL: ${{ vars.FLUTTER_API_BASE_URL }}

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build signed Android packages
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(awk '/^version:/ {print $2; exit}' pubspec.yaml)"
          version="${package_version%%+*}"
          build_number="${package_version##*+}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$build_number" =~ ^[1-9][0-9]*$ ]]
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME must match pubspec version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build_number=$build_number" >> "$GITHUB_OUTPUT"

      - name: Validate release configuration
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          : "${API_BASE_URL:?missing FLUTTER_API_BASE_URL repository variable}"
          [[ "$API_BASE_URL" =~ ^https?://[^/]+/.+ ]]
          : "${ANDROID_KEYSTORE_BASE64:?missing ANDROID_KEYSTORE_BASE64 secret}"
          : "${ANDROID_KEYSTORE_PASSWORD:?missing ANDROID_KEYSTORE_PASSWORD secret}"
          : "${ANDROID_KEY_ALIAS:?missing ANDROID_KEY_ALIAS secret}"
          : "${ANDROID_KEY_PASSWORD:?missing ANDROID_KEY_PASSWORD secret}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/xiguang-release.jks"
          chmod 600 "$RUNNER_TEMP/xiguang-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/xiguang-release.jks" >> "$GITHUB_ENV"

      - name: Verify signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -list \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" >/dev/null

      - name: Resolve locked dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate application sources
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build signed sideload APK
        shell: bash
        run: |
          set -euo pipefail
          flutter build apk \
            --release \
            --flavor sideload \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${{ steps.version.outputs.build_number }}" \
            --dart-define="API_BASE_URL=$API_BASE_URL"

      - name: Build signed ABI APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../artifacts
          cp build/app/outputs/flutter-apk/app-sideload-release.apk \
            "../artifacts/xiguang-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}-android-universal.apk"
          flutter build apk \
            --release \
            --flavor sideload \
            --split-per-abi \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${{ steps.version.outputs.build_number }}" \
            --dart-define="API_BASE_URL=$API_BASE_URL"
          while IFS= read -r apk; do
            cp "$apk" "../artifacts/xiguang-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}-$(basename "$apk")"
          done < <(find build/app/outputs/flutter-apk -maxdepth 1 -type f -name '*sideload*release.apk' ! -name 'app-sideload-release.apk' | sort)

      - name: Build signed Play Store AAB
        shell: bash
        run: |
          set -euo pipefail
          flutter build appbundle \
            --release \
            --flavor store \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${{ steps.version.outputs.build_number }}" \
            --dart-define="API_BASE_URL=$API_BASE_URL"
          aab="$(find build/app/outputs/bundle/storeRelease -maxdepth 1 -type f -name '*.aab' -print -quit)"
          test -n "$aab"
          cp "$aab" "../artifacts/xiguang-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}-android-store.aab"
          flutter build apk \
            --release \
            --flavor store \
            --build-name "${{ steps.version.outputs.version }}" \
            --build-number "${{ steps.version.outputs.build_number }}" \
            --dart-define="API_BASE_URL=$API_BASE_URL"
          cp build/app/outputs/flutter-apk/app-store-release.apk \
            "../artifacts/xiguang-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}-android-store.apk"

      - name: Verify packages and create checksums
        shell: bash
        run: |
          set -euo pipefail
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n1)"
          test -x "$build_tools/apksigner"
          for apk in ../artifacts/*.apk; do
            "$build_tools/apksigner" verify --verbose --print-certs "$apk"
          done
          universal="../artifacts/xiguang-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}-android-universal.apk"
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest permissions "$universal" \
            | grep -q 'android.permission.REQUEST_INSTALL_PACKAGES'
          store_apk="../artifacts/xiguang-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}-android-store.apk"
          if "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest permissions "$store_apk" \
            | grep -q 'android.permission.REQUEST_INSTALL_PACKAGES'; then
            echo "Store package unexpectedly contains REQUEST_INSTALL_PACKAGES" >&2
            exit 1
          fi
          cd ../artifacts
          sha256sum -- ./*.apk ./*.aab > SHA256SUMS.txt

      - name: Upload workflow packages
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: xiguang-${{ steps.version.outputs.version }}-${{ steps.version.outputs.build_number }}-android
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --verify-tag \
            --generate-notes \
            --title "隙光 $VERSION (build $BUILD_NUMBER)"
