worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile    on;
    keepalive_timeout 65;

    # 日志
    access_log /dev/stdout;
    error_log  /dev/stderr;

    # 上传大小限制（图片 10MB + 余量）
    client_max_body_size 11m;

    server {
        listen 80;
        server_name _;

        # ─── API 反向代理 ───
        location /api/ {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }

        # ─── 健康检查 ───
        location /healthz {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
        }

        location /readyz {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
        }

        # ─── App 发布 APK（在线更新） ───
        # 比 /media/ 更长前缀，会优先匹配。文件由发布脚本 scp 到该静态目录。
        location /media/app/ {
            alias /var/xiguang/app-releases/;
            add_header Cache-Control "public, max-age=3600";
            add_header Content-Disposition 'attachment';
        }

        # ─── MinIO 媒体文件（白噪音等） ───
        location /media/ {
            proxy_pass http://minio:9000/glimmer-media/;
            proxy_set_header Host $host;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # MinIO 预签名 URL 使用标准的 /{bucket}/{object} 路径，签名校验
        # 要求反向代理保留完整 URI，不能改写 bucket 前缀。
        location /glimmer-media/ {
            proxy_pass http://minio:9000;
            # SigV4 includes the exact Host value. Preserve the public port
            # (for example :8088) instead of using $host, which strips it.
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # ─── Flutter Web 静态文件 ───
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
