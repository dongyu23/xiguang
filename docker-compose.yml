name: xiguang

services:
  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-8088}:80"
      - "${HTTPS_PORT:-8443}:443"
    environment:
      PAYMENT_ENABLED: ${PAYMENT_ENABLED:-false}
      TLS_CERT_BASE64: ${TLS_CERT_BASE64:-}
      TLS_KEY_BASE64: ${TLS_KEY_BASE64:-}
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx.tls.conf:/etc/nginx/nginx.tls.conf:ro
      - ./scripts/nginx-entrypoint.sh:/xiguang-nginx-entrypoint.sh:ro
      - ./certs:/etc/nginx/certs:ro
      - ./app/build/web:/usr/share/nginx/html:ro
      # App 在线更新 APK 静态目录 — nginx alias 指向此路径。
      # 发布脚本把 APK 放到 ./app-releases/。
      - ./app-releases:/var/xiguang/app-releases:ro
    entrypoint: ["/bin/sh", "/xiguang-nginx-entrypoint.sh"]
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "if [ \"$${PAYMENT_ENABLED:-false}\" = true ]; then wget -q --no-check-certificate -O /dev/null https://127.0.0.1/healthz; else wget -q -O /dev/null http://127.0.0.1/healthz; fi"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 64m
    restart: unless-stopped

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        TARGETARCH: ${DOCKER_TARGETARCH:-amd64}
    expose:
      - "8080"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_PORT: ${APP_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_64_chars_minimum_for_real_deployments}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-720h}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-glimmer}
      DB_PASSWORD: ${DB_PASSWORD:-glimmer_dev_password}
      DB_NAME: ${DB_NAME:-glimmer}
      DB_SSLMODE: disable
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-glimmer_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-glimmer_minio_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-glimmer-media}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
      AI_DEEPSEEK_API_KEY: ${AI_DEEPSEEK_API_KEY}
      AI_DEEPSEEK_BASE_URL: ${AI_DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      AI_DEEPSEEK_MODEL: ${AI_DEEPSEEK_MODEL:-deepseek-v4-flash}
      AI_DAILY_QUOTA_PER_USER: ${AI_DAILY_QUOTA_PER_USER:-50}
      ASR_PROVIDER: ${ASR_PROVIDER:-tencent}
      TENCENT_ASR_APP_ID: ${TENCENT_ASR_APP_ID}
      TENCENT_ASR_SECRET_ID: ${TENCENT_ASR_SECRET_ID}
      TENCENT_ASR_SECRET_KEY: ${TENCENT_ASR_SECRET_KEY}
      TENCENT_ASR_REGION: ${TENCENT_ASR_REGION:-ap-shanghai}
      TENCENT_ASR_ENDPOINT: ${TENCENT_ASR_ENDPOINT:-asr.tencentcloudapi.com}
      TENCENT_ASR_ENGINE_MODEL_TYPE: ${TENCENT_ASR_ENGINE_MODEL_TYPE:-16k_zh}
      TENCENT_ASR_REALTIME_HOST: ${TENCENT_ASR_REALTIME_HOST:-asr.cloud.tencent.com}
      RELEASE_STATIC_DIR: ${RELEASE_STATIC_DIR:-/var/xiguang/app-releases}
      RELEASE_DOWNLOAD_BASE: ${RELEASE_DOWNLOAD_BASE:-/media/app}
      PAYMENT_ENABLED: ${PAYMENT_ENABLED:-false}
      PAYMENT_ENV: ${PAYMENT_ENV:-sandbox}
      PAYMENT_CHANNELS: ${PAYMENT_CHANNELS:-}
      PAYMENT_PUBLIC_BASE_URL: ${PAYMENT_PUBLIC_BASE_URL:-}
      PAYMENT_DATA_ENCRYPTION_KEY: ${PAYMENT_DATA_ENCRYPTION_KEY:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
      APPLE_APP_ID: ${APPLE_APP_ID:-}
      APPLE_ISSUER_ID: ${APPLE_ISSUER_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY_BASE64: ${APPLE_PRIVATE_KEY_BASE64:-}
      WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID:-}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_CERT_SERIAL: ${WECHAT_PAY_CERT_SERIAL:-}
      WECHAT_PAY_PRIVATE_KEY_BASE64: ${WECHAT_PAY_PRIVATE_KEY_BASE64:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_PLAN_ID: ${WECHAT_PAY_PLAN_ID:-}
      WECHAT_PAY_API_BASE: ${WECHAT_PAY_API_BASE:-https://api.mch.weixin.qq.com}
      WECHAT_PAY_CONTRACT_PATH: ${WECHAT_PAY_CONTRACT_PATH:-/v3/papay/contracts/app-pre-entrust-sign}
      WECHAT_PAY_CHARGE_PATH: ${WECHAT_PAY_CHARGE_PATH:-/v3/papay/transactions}
      WECHAT_PAY_QUERY_PATH: ${WECHAT_PAY_QUERY_PATH:-/v3/papay/transactions/out-trade-no/{out_trade_no}}
      WECHAT_PAY_CANCEL_PATH: ${WECHAT_PAY_CANCEL_PATH:-/v3/papay/contracts/{contract_id}/terminate}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_APP_PRIVATE_KEY_BASE64: ${ALIPAY_APP_PRIVATE_KEY_BASE64:-}
      ALIPAY_APP_PUBLIC_CERT_BASE64: ${ALIPAY_APP_PUBLIC_CERT_BASE64:-}
      ALIPAY_PUBLIC_CERT_BASE64: ${ALIPAY_PUBLIC_CERT_BASE64:-}
      ALIPAY_ROOT_CERT_BASE64: ${ALIPAY_ROOT_CERT_BASE64:-}
      ALIPAY_PERSONAL_PRODUCT_CODE: ${ALIPAY_PERSONAL_PRODUCT_CODE:-}
      ALIPAY_SIGN_SCENE: ${ALIPAY_SIGN_SCENE:-INDUSTRY|DEFAULT}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-}
      PAYMENT_ENABLED_FILE: ${PAYMENT_ENABLED_FILE:-}
      PAYMENT_ENV_FILE: ${PAYMENT_ENV_FILE:-}
      PAYMENT_CHANNELS_FILE: ${PAYMENT_CHANNELS_FILE:-}
      PAYMENT_PUBLIC_BASE_URL_FILE: ${PAYMENT_PUBLIC_BASE_URL_FILE:-}
      PAYMENT_DATA_ENCRYPTION_KEY_FILE: ${PAYMENT_DATA_ENCRYPTION_KEY_FILE:-}
      APPLE_BUNDLE_ID_FILE: ${APPLE_BUNDLE_ID_FILE:-}
      APPLE_APP_ID_FILE: ${APPLE_APP_ID_FILE:-}
      APPLE_ISSUER_ID_FILE: ${APPLE_ISSUER_ID_FILE:-}
      APPLE_KEY_ID_FILE: ${APPLE_KEY_ID_FILE:-}
      APPLE_PRIVATE_KEY_BASE64_FILE: ${APPLE_PRIVATE_KEY_BASE64_FILE:-}
      WECHAT_PAY_APP_ID_FILE: ${WECHAT_PAY_APP_ID_FILE:-}
      WECHAT_PAY_MCH_ID_FILE: ${WECHAT_PAY_MCH_ID_FILE:-}
      WECHAT_PAY_CERT_SERIAL_FILE: ${WECHAT_PAY_CERT_SERIAL_FILE:-}
      WECHAT_PAY_PRIVATE_KEY_BASE64_FILE: ${WECHAT_PAY_PRIVATE_KEY_BASE64_FILE:-}
      WECHAT_PAY_API_V3_KEY_FILE: ${WECHAT_PAY_API_V3_KEY_FILE:-}
      WECHAT_PAY_PLAN_ID_FILE: ${WECHAT_PAY_PLAN_ID_FILE:-}
      ALIPAY_APP_ID_FILE: ${ALIPAY_APP_ID_FILE:-}
      ALIPAY_APP_PRIVATE_KEY_BASE64_FILE: ${ALIPAY_APP_PRIVATE_KEY_BASE64_FILE:-}
      ALIPAY_APP_PUBLIC_CERT_BASE64_FILE: ${ALIPAY_APP_PUBLIC_CERT_BASE64_FILE:-}
      ALIPAY_PUBLIC_CERT_BASE64_FILE: ${ALIPAY_PUBLIC_CERT_BASE64_FILE:-}
      ALIPAY_ROOT_CERT_BASE64_FILE: ${ALIPAY_ROOT_CERT_BASE64_FILE:-}
      ALIPAY_PERSONAL_PRODUCT_CODE_FILE: ${ALIPAY_PERSONAL_PRODUCT_CODE_FILE:-}
    volumes:
      # 与 nginx 共享 APK 静态目录，后端 service 校验文件存在性。
      - ./app-releases:/var/xiguang/app-releases:ro
      # `_FILE` 形式的密钥放入本地 secrets/，该目录已被 git 忽略。
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "/app/xiguang", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  payment-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        TARGETARCH: ${DOCKER_TARGETARCH:-amd64}
    command: ["payment-init"]
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-glimmer}
      DB_PASSWORD: ${DB_PASSWORD:-glimmer_dev_password}
      DB_NAME: ${DB_NAME:-glimmer}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-dev_only_change_me_64_chars_minimum_for_real_deployments}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-*}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-glimmer_minio}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-glimmer_minio_password}
      PAYMENT_ENABLED: ${PAYMENT_ENABLED:-false}
      PAYMENT_ENV: ${PAYMENT_ENV:-sandbox}
      PAYMENT_CHANNELS: ${PAYMENT_CHANNELS:-}
      PAYMENT_PUBLIC_BASE_URL: ${PAYMENT_PUBLIC_BASE_URL:-}
      PAYMENT_DATA_ENCRYPTION_KEY: ${PAYMENT_DATA_ENCRYPTION_KEY:-}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-}
      APPLE_APP_ID: ${APPLE_APP_ID:-}
      APPLE_ISSUER_ID: ${APPLE_ISSUER_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY_BASE64: ${APPLE_PRIVATE_KEY_BASE64:-}
      WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID:-}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_CERT_SERIAL: ${WECHAT_PAY_CERT_SERIAL:-}
      WECHAT_PAY_PRIVATE_KEY_BASE64: ${WECHAT_PAY_PRIVATE_KEY_BASE64:-}
      WECHAT_PAY_API_V3_KEY: ${WECHAT_PAY_API_V3_KEY:-}
      WECHAT_PAY_PLAN_ID: ${WECHAT_PAY_PLAN_ID:-}
      WECHAT_PAY_API_BASE: ${WECHAT_PAY_API_BASE:-https://api.mch.weixin.qq.com}
      WECHAT_PAY_CONTRACT_PATH: ${WECHAT_PAY_CONTRACT_PATH:-/v3/papay/contracts/app-pre-entrust-sign}
      WECHAT_PAY_CHARGE_PATH: ${WECHAT_PAY_CHARGE_PATH:-/v3/papay/transactions}
      WECHAT_PAY_QUERY_PATH: ${WECHAT_PAY_QUERY_PATH:-/v3/papay/transactions/out-trade-no/{out_trade_no}}
      WECHAT_PAY_CANCEL_PATH: ${WECHAT_PAY_CANCEL_PATH:-/v3/papay/contracts/{contract_id}/terminate}
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_APP_PRIVATE_KEY_BASE64: ${ALIPAY_APP_PRIVATE_KEY_BASE64:-}
      ALIPAY_APP_PUBLIC_CERT_BASE64: ${ALIPAY_APP_PUBLIC_CERT_BASE64:-}
      ALIPAY_PUBLIC_CERT_BASE64: ${ALIPAY_PUBLIC_CERT_BASE64:-}
      ALIPAY_ROOT_CERT_BASE64: ${ALIPAY_ROOT_CERT_BASE64:-}
      ALIPAY_PERSONAL_PRODUCT_CODE: ${ALIPAY_PERSONAL_PRODUCT_CODE:-}
      ALIPAY_SIGN_SCENE: ${ALIPAY_SIGN_SCENE:-INDUSTRY|DEFAULT}
      ALIPAY_GATEWAY: ${ALIPAY_GATEWAY:-}
      PAYMENT_ENABLED_FILE: ${PAYMENT_ENABLED_FILE:-}
      PAYMENT_ENV_FILE: ${PAYMENT_ENV_FILE:-}
      PAYMENT_CHANNELS_FILE: ${PAYMENT_CHANNELS_FILE:-}
      PAYMENT_PUBLIC_BASE_URL_FILE: ${PAYMENT_PUBLIC_BASE_URL_FILE:-}
      PAYMENT_DATA_ENCRYPTION_KEY_FILE: ${PAYMENT_DATA_ENCRYPTION_KEY_FILE:-}
      APPLE_BUNDLE_ID_FILE: ${APPLE_BUNDLE_ID_FILE:-}
      APPLE_APP_ID_FILE: ${APPLE_APP_ID_FILE:-}
      APPLE_ISSUER_ID_FILE: ${APPLE_ISSUER_ID_FILE:-}
      APPLE_KEY_ID_FILE: ${APPLE_KEY_ID_FILE:-}
      APPLE_PRIVATE_KEY_BASE64_FILE: ${APPLE_PRIVATE_KEY_BASE64_FILE:-}
      WECHAT_PAY_APP_ID_FILE: ${WECHAT_PAY_APP_ID_FILE:-}
      WECHAT_PAY_MCH_ID_FILE: ${WECHAT_PAY_MCH_ID_FILE:-}
      WECHAT_PAY_CERT_SERIAL_FILE: ${WECHAT_PAY_CERT_SERIAL_FILE:-}
      WECHAT_PAY_PRIVATE_KEY_BASE64_FILE: ${WECHAT_PAY_PRIVATE_KEY_BASE64_FILE:-}
      WECHAT_PAY_API_V3_KEY_FILE: ${WECHAT_PAY_API_V3_KEY_FILE:-}
      WECHAT_PAY_PLAN_ID_FILE: ${WECHAT_PAY_PLAN_ID_FILE:-}
      ALIPAY_APP_ID_FILE: ${ALIPAY_APP_ID_FILE:-}
      ALIPAY_APP_PRIVATE_KEY_BASE64_FILE: ${ALIPAY_APP_PRIVATE_KEY_BASE64_FILE:-}
      ALIPAY_APP_PUBLIC_CERT_BASE64_FILE: ${ALIPAY_APP_PUBLIC_CERT_BASE64_FILE:-}
      ALIPAY_PUBLIC_CERT_BASE64_FILE: ${ALIPAY_PUBLIC_CERT_BASE64_FILE:-}
      ALIPAY_ROOT_CERT_BASE64_FILE: ${ALIPAY_ROOT_CERT_BASE64_FILE:-}
      ALIPAY_PERSONAL_PRODUCT_CODE_FILE: ${ALIPAY_PERSONAL_PRODUCT_CODE_FILE:-}
    volumes:
      - ./secrets:/run/secrets:ro
    depends_on:
      postgres:
        condition: service_healthy
      nginx:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16
    expose:
      - "5432"
    environment:
      POSTGRES_USER: ${DB_USER:-glimmer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-glimmer_dev_password}
      POSTGRES_DB: ${DB_NAME:-glimmer}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-glimmer} -d ${DB_NAME:-glimmer}"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - log_min_duration_statement=200ms

  redis:
    image: redis:7-alpine
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    mem_limit: 128m
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    expose:
      - "9000"
      - "9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-glimmer_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-glimmer_minio_password}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m
    restart: unless-stopped

volumes:
  pg_data:
  minio_data:
  redis_data:
