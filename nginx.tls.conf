worker_processes auto;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 51m;
    access_log /dev/stdout;
    error_log /dev/stderr;

    server {
        listen 80;
        server_name _;
        return 308 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name _;
        ssl_certificate /tmp/tls.crt;
        ssl_certificate_key /tmp/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;

        location /api/ {
            proxy_pass http://app:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 120s;
            proxy_buffering off;
        }
        location /healthz { proxy_pass http://app:8080; }
        location /readyz { proxy_pass http://app:8080; }
		location /metrics { proxy_pass http://app:8080; }
        location /media/app/ {
            alias /var/xiguang/app-releases/;
            add_header Cache-Control "public, max-age=3600";
            add_header Content-Disposition 'attachment';
        }
        location /glimmer-media/ {
            proxy_pass http://minio:9000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_request_buffering off;
        }
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
