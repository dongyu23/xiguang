# Managed HTTPS entry for the Xiguang production API.
server {
  listen 80;
  listen [::]:80;
  server_name api.frozenfish.cn;

  include /etc/nginx/conf.d/include/letsencrypt-acme-challenge.conf;

  location / {
    return 308 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name api.frozenfish.cn;

  ssl_certificate /etc/letsencrypt/live/api.frozenfish.cn/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/api.frozenfish.cn/privkey.pem;
  include /etc/nginx/conf.d/include/ssl-cache.conf;
  include /etc/nginx/conf.d/include/ssl-ciphers.conf;

  client_max_body_size 51m;

  add_header Strict-Transport-Security "max-age=31536000" always;
  add_header X-Content-Type-Options "nosniff" always;

  location / {
    proxy_pass http://172.17.0.1:8088;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_buffering off;
  }
}
